<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-2deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .floating-element-1 { animation: float1 6s ease-in-out infinite; }
    .floating-element-2 { animation: float2 7s ease-in-out infinite; }
    .pulsing-glow { animation: pulse-glow 4s ease-in-out infinite; transform-origin: center; }
    .animated-border { stroke-dasharray: 8 8; animation: dash 15s linear infinite; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Background Orbs -->
  <circle cx="150" cy="100" r="180" fill="url(#glow-grad)" class="pulsing-glow" />
  <circle cx="1050" cy="300" r="220" fill="url(#glow-grad)" class="pulsing-glow" style="animation-delay: -2s;" />

  <!-- Technical Grid Overlay -->
  <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200 M 200 0 V 400 M 400 0 V 400 M 600 0 V 400 M 800 0 V 400 M 1000 0 V 400" 
        stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />

  <!-- Dynamic Animated Graphics (Background Layer) -->
  <!-- Stylus / Vector Path Graphic -->
  <g class="floating-element-1" transform="translate(900, 70)">
    <rect x="0" y="0" width="220" height="150" rx="12" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />
    <path d="M 30 100 Q 80 20 130 90 T 190 40" fill="none" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round" />
    <circle cx="190" cy="40" r="6" fill="#38bdf8" class="pulsing-glow" />
    <!-- Stylus Icon -->
    <g transform="translate(140, 30) rotate(-45)">
      <path d="M0,0 L10,-20 L20,0 L15,80 L5,80 Z" fill="#818cf8" opacity="0.8" />
      <polygon points="10,-20 0,0 20,0" fill="#c084fc" />
    </g>
  </g>

  <!-- Tablet Convertible Graphic -->
  <g class="floating-element-2" transform="translate(80, 210)">
    <rect x="0" y="0" width="200" height="130" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="2" />
    <rect x="15" y="15" width="170" height="90" rx="6" fill="rgba(51, 65, 85, 0.4)" />
    <!-- Screen content lines -->
    <line x1="30" y1="35" x2="110" y2="35" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="50" x2="140" y2="50" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="30" y1="65" x2="90" y2="65" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Keyboard Hinge -->
    <path d="M -10 130 L 210 130" stroke="#818cf8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Central Foreground Content Card (Ensures readability) -->
  <rect x="180" y="60" width="840" height="280" rx="20" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="180" y="60" width="840" height="280" rx="20" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" class="animated-border" opacity="0.6" />

  <!-- Foreground Text Content -->
  <!-- Top Tag / Pill -->
  <g transform="translate(220, 100)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#38bdf8" class="pulsing-glow" />
    <text x="30" y="18" class="badge-text">HARDWARE &amp; LINUX ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="220" y="175" class="title-text" font-size="38" filter="url(#glow)">Awesome 2-in-1 Tablet</text>
  <text x="220" y="225" class="title-text" font-size="38" fill="url(#accent-grad)">Computer Hardware 💻🖊️</text>

  <!-- Subtitle -->
  <text x="220" y="275" class="subtitle-text" font-size="16">
    Curated Guide to Detachable &amp; Convertible Laptops • Linux Kernels • Stylus Apps
  </text>

  <!-- Feature Pills Footer -->
  <g transform="translate(220, 295)">
    <rect x="0" y="0" width="110" height="24" rx="6" fill="rgba(255, 255, 255, 0.06)" />
    <text x="12" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1">🐧 Surface Linux</text>

    <rect x="120" y="0" width="110" height="24" rx="6" fill="rgba(255, 255, 255, 0.06)" />
    <text x="132" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1">🎨 Stylus Apps</text>

    <rect x="240" y="0" width="130" height="24" rx="6" fill="rgba(255, 255, 255, 0.06)" />
    <text x="252" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1">⚡ Touch Desktops</text>

    <rect x="380" y="0" width="120" height="24" rx="6" fill="rgba(255, 255, 255, 0.06)" />
    <text x="392" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1">📊 Market Guide</text>
  </g>
</svg>
